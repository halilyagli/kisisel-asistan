version: '3.8'

services:
  # 1. PostgreSQL 16 (Canlı Finansal Veritabanı)
  postgres:
    image: postgres:16-alpine
    container_name: asistan_postgres
    restart: always
    environment:
      POSTGRES_USER: asistan_user
      POSTGRES_PASSWORD: asistan_secure_password_2026
      POSTGRES_DB: asistan_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistan_user -d asistan_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Arka Plan Kuyrukları & BullMQ)
  redis:
    image: redis:7-alpine
    container_name: asistan_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Backend REST API (Node.js + NestJS/Express)
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: asistan_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://asistan_user:asistan_secure_password_2026@postgres:5432/asistan_production?schema=public"
      JWT_SECRET: "production_secret_jwt_change_in_env_2026"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Frontend Web (React + Vite + Nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: asistan_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
