services:
  # 1. Backend API (Node.js + Express + Prisma)
  - type: web
    name: kisisel-asistan-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: kisisel-asistan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Web App (React + Vite SPA)
  - type: web
    name: kisisel-asistan-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kisisel-asistan-backend
          property: host

databases:
  # 3. PostgreSQL Managed Database
  - name: kisisel-asistan-db
    plan: starter
    databaseName: asistan_production
    user: asistan_admin
